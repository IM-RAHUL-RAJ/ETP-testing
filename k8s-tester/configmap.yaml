apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  namespace: tester
data:
  DB_HOST: database-1.c94cwk4g097q.ap-south-1.rds.amazonaws.com
  DB_PORT: "5432"
  DB_NAME: trading_system_db
  DB_USER: postgres
  JWT_ISSUER: auth-service
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  POLL_INTERVAL_SECONDS: "60"
  ETL_ENABLED: "false"
  ETL_REFRESH_INTERVAL_SECONDS: "45"
  DUCKDB_PATH: /data/analytics.duckdb
