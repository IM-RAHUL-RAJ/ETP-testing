apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-executor
  namespace: tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-executor
  template:
    metadata:
      labels:
        app: trade-executor
    spec:
      imagePullSecrets:
        - name: artifactory-pull-secret
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  stack: trading-tester
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-kafka-topics
          image: apache/kafka:3.8.0
          command:
            - /bin/sh
            - -c
            - until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic orders >/dev/null 2>&1; do echo waiting for Kafka topics; sleep 5; done
      containers:
        - name: trade-executor
          image: trialzww0tc.jfrog.io/REPLACE_WITH_DOCKER_REPOSITORY_KEY/trading-executor:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: db-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
            - name: FAUXNANCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: fauxnance-api-key
            - name: FAUXNANCE_BASE_URL
              value: http://localhost:8080
            - name: POLL_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: POLL_INTERVAL_SECONDS
            - name: ETL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: ETL_ENABLED
            - name: ETL_REFRESH_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: ETL_REFRESH_INTERVAL_SECONDS
            - name: ETL_PYTHON_SCRIPT_PATH
              value: etl_trigger_service.py
            - name: ETL_PYTHON_EXECUTABLE
              value: python3
            - name: DUCKDB_PATH
              value: /data/analytics.duckdb
            - name: PG_SCHEMA
              value: trading
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: analytics-data
              mountPath: /data
      volumes:
        - name: analytics-data
          persistentVolumeClaim:
            claimName: analytics-data