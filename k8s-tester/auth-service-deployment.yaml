apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: artifactory-pull-secret
      containers:
        - name: auth-service
          image: trialzww0tc.jfrog.io/REPLACE_WITH_DOCKER_REPOSITORY_KEY/trading-auth-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: jwt-secret
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: JWT_ISSUER
            - name: LOGIN_KEY_DIR
              value: /tmp/login-keys
            - name: COOKIE_SECURE
              value: "false"
            - name: COOKIE_SAMESITE
              value: lax
          startupProbe:
            httpGet:
              path: /docs/json
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /docs/json
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs/json
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 250m
              memory: 384Mi