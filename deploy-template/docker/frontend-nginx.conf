# The page, plus the API paths forwarded to the services. auth-service and order-service
# are the container names (docker compose) and the Service names (Kubernetes), so this
# file is the same everywhere.
#
# CHANGE ME if your APIs use other paths or ports: the two "location" blocks below.
# Example: if your auth API is /api/auth/... and your trade API is /api/v1/..., use
#   location /api/auth/ { proxy_pass http://auth-service:3000; ... }
#   location /api/      { proxy_pass http://order-service:8081; ... }
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  # Auth service: /auth/login, /auth/register, /auth/me ...
  location /auth/ {
    proxy_pass http://auth-service:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Trade API: /api/... (also carries server-sent events and websockets)
  location /api/ {
    proxy_pass http://order-service:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Angular routes (/login, /dashboard, ...) all serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
