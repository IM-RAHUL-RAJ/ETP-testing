# Phase 1: executor-service gets its own public load balancer (an AWS Network/Classic LB).
#   envsubst '$PROJECT $ECR_REGISTRY $IMAGE_TAG' < deploy/k8s/executor-service/service.yaml | kubectl apply -f -
# Phase 2 (one load balancer for everything): apply service-internal.yaml instead (README step 10).
apiVersion: v1
kind: Service
metadata:
  name: executor-service
  namespace: ${PROJECT}
spec:
  type: LoadBalancer
  selector: { app: executor-service }
  ports:
    - { name: http, port: 8082, targetPort: 8082 }
