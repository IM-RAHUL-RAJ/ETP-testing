# Phase 1: frontend gets its own public load balancer (an AWS Network/Classic LB).
#   envsubst '$PROJECT $ECR_REGISTRY $IMAGE_TAG' < deploy/k8s/frontend/service.yaml | kubectl apply -f -
# Phase 2 (one load balancer for everything): apply service-internal.yaml instead (README step 10).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ${PROJECT}
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
