# Phase 2: no load balancer of its own; the Ingress (ingress/ingress.yaml) reaches it.
#   envsubst '$PROJECT $ECR_REGISTRY $IMAGE_TAG' < deploy/k8s/frontend/service-internal.yaml | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ${PROJECT}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: "/"
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
