# EBS gp3 disks for Kafka (needs the aws-ebs-csi-driver add-on, README step 7).
# One per cluster: if it already exists, kubectl reports "unchanged".
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
