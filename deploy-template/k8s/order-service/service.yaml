# Phase 1: order-service gets its own public load balancer (an AWS Network/Classic LB).
#   envsubst '$PROJECT $ECR_REGISTRY $IMAGE_TAG' < deploy/k8s/order-service/service.yaml | kubectl apply -f -
# Phase 2 (one load balancer for everything): apply service-internal.yaml instead (README step 10).
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ${PROJECT}
spec:
  type: LoadBalancer
  selector: { app: order-service }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
