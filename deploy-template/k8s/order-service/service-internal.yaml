# Phase 2: no load balancer of its own; the Ingress (ingress/ingress.yaml) reaches it.
#   envsubst '$PROJECT $ECR_REGISTRY $IMAGE_TAG' < deploy/k8s/order-service/service-internal.yaml | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ${PROJECT}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: "/actuator/health"
spec:
  type: ClusterIP
  selector: { app: order-service }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
