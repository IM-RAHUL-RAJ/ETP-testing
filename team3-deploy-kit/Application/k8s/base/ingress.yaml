# One public Application Load Balancer for the whole application (overlays 2
# and 3; overlay 1 removes it), built by
# the AWS Load Balancer Controller from this object. Paths are routing rules:
#   /auth...   -> auth-service     (the BFF)
#   /api...    -> order-service    (trade API)
#   everything else -> frontend
# The executor is not listed: the browser never calls it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Send traffic straight to pod IPs, so the Services stay internal (ClusterIP).
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /auth                       # <-- PROJECT: the auth service's URL prefix
            pathType: Prefix
            backend: {service: {name: auth-service, port: {number: 3000}}}
          - path: /api                        # <-- PROJECT: the order service's URL prefix
            pathType: Prefix
            backend: {service: {name: order-service, port: {number: 8081}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 80}}}
