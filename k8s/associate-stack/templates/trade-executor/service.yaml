apiVersion: v1
kind: Service
metadata:
  name: {{ include "associate-stack.id" . }}-trade-executor
  labels:
    {{- include "associate-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: trade-executor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trade-executor
    app.kubernetes.io/instance: {{ include "associate-stack.id" . | quote }}
  ports:
    - name: http
      port: 8083
      targetPort: http